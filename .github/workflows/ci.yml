name: CI

on:
  push:
    branches: [agentic]
  pull_request:
    branches: [agentic]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-chat

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: excel-chat/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest tests/ \
            --ignore=tests/test_query_pipeline.py \
            --ignore=tests/test_frontend_integration.py \
            --ignore=tests/test_real_agent_codegen.py \
            -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-chat

    services:
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: test
          MINIO_ROOT_PASSWORD: testtest
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: excel-chat/backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio requests

      - name: Create S3 bucket in MinIO
        run: |
          pip install minio
          python3 -c "
          from minio import Minio
          c = Minio('127.0.0.1:9000', access_key='test', secret_key='testtest', secure=False)
          if not c.bucket_exists('ragsheets'):
              c.make_bucket('ragsheets')
          print('MinIO bucket created')
          "

      - name: Start backend server
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: testtest
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cd backend/src
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          # Wait for health endpoint
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/health | grep -q "ok"; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done
          curl -s http://127.0.0.1:8000/health || { echo "Backend failed to start"; exit 1; }

      - name: Run integration tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          S3_ENDPOINT_URL: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: testtest
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest tests/test_query_pipeline.py tests/test_frontend_integration.py \
            -v --tb=short

      - name: Run real agent tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest tests/test_real_agent_codegen.py \
            -v --tb=short

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/uvicorn.pid ]; then
            kill $(cat /tmp/uvicorn.pid) || true
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: excel-chat/frontend/ragsheets

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: excel-chat/frontend/ragsheets/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, integration-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/agentic'
    defaults:
      run:
        working-directory: excel-chat

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PROJECT_TOKEN }}
        run: |
          railway up --service excel-chat \
            --project ${{ secrets.RAILWAY_PROJECT_ID }} \
            --environment production \
            --detach \
            -m "Deploy ${GITHUB_SHA::7} via CI/CD"

      - name: Wait for deployment to be live
        timeout-minutes: 5
        run: |
          sleep 30
          HEALTH_URL="https://excel-chat-production-76dc.up.railway.app/health"
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              curl -s "$HEALTH_URL"
              exit 0
            fi
            echo "Attempt $i: HTTP $RESPONSE — retrying in 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 10 attempts"
          exit 1
